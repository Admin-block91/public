<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skardu Bazar</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f9;color:#17202a}
header{background:#0b5d5e;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:800}.tag{opacity:.85;font-size:13px;margin-top:3px}
.search{margin-top:15px;display:flex;gap:8px}.search input{flex:1;padding:13px;border:0;border-radius:10px;font-size:15px}
.search button{border:0;border-radius:10px;padding:0 15px;background:#f4c542}
nav{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:white}
nav button{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:9px 13px;border-radius:20px}
main{max-width:900px;margin:auto;padding:16px}.hero{background:#dff2ef;border-radius:18px;padding:22px;margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0 0 15px}.cta{background:#0b5d5e;color:white;border:0;padding:12px 17px;border-radius:10px;font-weight:bold}
h2{font-size:20px;margin:22px 0 12px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:white;border-radius:14px;padding:15px;text-align:center;box-shadow:0 1px 4px #0001}.cat b{display:block;margin-top:7px;font-size:13px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border-radius:15px;padding:12px;box-shadow:0 1px 5px #0001}.pic{height:130px;border-radius:12px;background:#e7ecef;display:grid;place-items:center;font-size:45px}.price{font-weight:800;color:#0b5d5e;margin-top:7px}.card button{width:100%;margin-top:9px;padding:10px;border:0;border-radius:9px;background:#0b5d5e;color:white}
.panel{background:white;border-radius:15px;padding:16px;margin-top:16px;box-shadow:0 1px 5px #0001}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid #eee;cursor:pointer}.row:last-child{border-bottom:0}
.row:hover{background:#fafafa}.arrow{font-size:22px;color:#0b5d5e}
input,textarea,select{font:inherit}.field{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #d5dadd;border-radius:10px}
.back{border:0;background:#eef3f4;padding:9px 13px;border-radius:9px;margin-bottom:8px}
.notice{background:#fff8df;padding:12px;border-radius:10px;margin-top:12px}
footer{text-align:center;padding:28px 15px;color:#68737d;font-size:13px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}.cats{grid-template-columns:repeat(8,1fr)}}
</style>
</head>
<body>
<header>
<div class="logo">🏔️ Skardu Bazar</div><div class="tag">Your local marketplace in Skardu</div>
<div class="search"><input id="search" placeholder="Search products, shops..."><button onclick="searchProducts()">Search</button></div>
</header>
<nav>
<button onclick="show('home')">Home</button><button onclick="show('shop')">Shop</button><button onclick="show('seller')">Sell</button><button onclick="show('account')">Account</button><button onclick="show('help')">Help</button>
</nav>
<main id="app"></main>
<footer>© 2026 Skardu Bazar • Local shops • Local customers</footer>

<script>
const products=[
['🧥','Winter Jacket','Rs. 6,500'],['👟','Hiking Shoes','Rs. 5,200'],['🍯','Local Honey','Rs. 1,800'],['🧶','Wool Shawl','Rs. 3,500'],
['🍎','Fresh Apples','Rs. 450'],['🎒','Travel Bag','Rs. 2,900'],['📱','Mobile Accessories','Rs. 700'],['☕','Local Dry Fruit','Rs. 2,400']
];
let cart=[];

function productCards(){
 return products.map((p,i)=>`<div class="card"><div class="pic">${p[0]}</div><b>${p[1]}</b><div class="price">${p[2]}</div><button onclick="add(${i})">Add to Cart</button></div>`).join('');
}
function home(){
 app.innerHTML=`<section class="hero"><h1>Shop Local. Buy Local.</h1><p>Discover products and businesses from Skardu in one place.</p><button class="cta" onclick="show('shop')">Start Shopping</button></section>
<h2>Categories</h2><div class="cats">${[['🛒','Grocery'],['👕','Clothing'],['📱','Electronics'],['🍎','Food'],['🏕️','Travel'],['🏠','Home'],['💄','Beauty'],['🔧','Services']].map(x=>`<div class="cat">${x[0]}<b>${x[1]}</b></div>`).join('')}</div>
<h2>Popular Products</h2><div class="products">${productCards()}</div>
<div class="panel"><b>🏪 Want to sell on Skardu Bazar?</b><p>Create your shop and reach local customers.</p><button class="cta" onclick="show('seller')">Become a Seller</button></div>`;
}
function shop(){
 app.innerHTML=`<h2>🛍️ Skardu Bazar Marketplace</h2><div class="products">${productCards()}</div>
<div class="panel"><b>Cart: ${cart.length} item(s)</b><br><br><button class="cta" onclick="show('account')">Go to Account / Checkout</button></div>`;
}
function seller(){
 app.innerHTML=`<h2>🏪 Seller Center</h2>
<div class="panel">
<div class="row" onclick="sellerForm()"><b>Shop registration</b><span class="arrow">→</span></div>
<div class="row" onclick="addProductForm()"><b>Add products</b><span class="arrow">→</span></div>
<div class="row" onclick="alert('Orders section is ready for backend connection.')"><b>Manage orders</b><span class="arrow">→</span></div>
<div class="row" onclick="alert('Sales & earnings will connect to the backend.')"><b>Sales & earnings</b><span class="arrow">→</span></div>
<div class="row" onclick="alert('Customer reviews section is ready.')"><b>Customer reviews</b><span>⭐</span></div>
</div>
<div class="panel"><b>Seller account</b><p>Frontend demo is working. Login, approval, payments and real orders will be connected in the backend phase.</p></div>`;
}
function sellerForm(){
 app.innerHTML=`<button class="back" onclick="seller()">← Back to Seller Center</button><h2>🏪 Shop Registration</h2>
<div class="panel"><label>Shop name</label><input class="field" id="shopName" placeholder="Enter shop name">
<label>Owner name</label><input class="field" id="ownerName" placeholder="Enter owner name">
<label>Phone / WhatsApp</label><input class="field" id="shopPhone" placeholder="03xxxxxxxxx">
<label>Shop category</label><select class="field"><option>Grocery</option><option>Clothing</option><option>Electronics</option><option>Food</option><option>Travel</option><option>Other</option></select>
<button class="cta" onclick="saveShop()">Submit Shop Registration</button></div>`;
}
function saveShop(){
 let n=document.getElementById('shopName').value.trim();
 if(!n){alert('Please enter your shop name.');return}
 alert('Shop registration saved in this demo. Backend approval will be added later.');
 seller();
}
function addProductForm(){
 app.innerHTML=`<button class="back" onclick="seller()">← Back to Seller Center</button><h2>➕ Add Product</h2>
<div class="panel"><label>Product name</label><input class="field" id="newName" placeholder="e.g. Apricot Jam">
<label>Price</label><input class="field" id="newPrice" placeholder="Rs. 1500">
<label>Category</label><select class="field"><option>Grocery</option><option>Clothing</option><option>Food</option><option>Electronics</option><option>Travel</option></select>
<button class="cta" onclick="saveProduct()">Add Product</button></div>`;
}
function saveProduct(){
 let n=document.getElementById('newName').value.trim(), p=document.getElementById('newPrice').value.trim();
 if(!n||!p){alert('Please enter product name and price.');return}
 products.push(['📦',n,p.startsWith('Rs.')?p:'Rs. '+p]);
 alert('Product added to this demo marketplace.');
 seller();
}
function account(){
 app.innerHTML=`<h2>👤 My Account</h2><div class="panel">
<div class="row" onclick="alert('No orders yet.')"><b>My Orders</b><span class="arrow">→</span></div>
<div class="row" onclick="show('shop')"><b>Cart</b><span>${cart.length}</span></div>
<div class="row" onclick="alert('Wishlist is ready for backend connection.')"><b>Wishlist</b><span>♡</span></div>
<div class="row" onclick="alert('Address book will be added in backend.')"><b>Addresses</b><span class="arrow">→</span></div>
<div class="row" onclick="alert('Ratings & reviews are ready.')"><b>Ratings & Reviews</b><span>⭐</span></div>
</div>`;
}
function help(){
 app.innerHTML=`<h2>🆘 Help & Feedback</h2><div class="panel">
<p><b>Order problem?</b></p><p><b>Payment problem?</b></p><p><b>Delivery problem?</b></p><p><b>Report a seller?</b></p>
<textarea id="fb" placeholder="Write your feedback..." style="width:100%;height:110px;padding:12px;border:1px solid #ddd;border-radius:10px"></textarea><br><br>
<button class="cta" onclick="sendFeedback()">Send Feedback</button></div>`;
}
function sendFeedback(){
 let t=document.getElementById('fb').value.trim(); if(!t){alert('Please write your feedback first.');return}
 alert('Thanks! Your feedback is saved in this demo.');
}
function add(i){cart.push(products[i]);alert(products[i][1]+' added to cart');}
function searchProducts(){
 let q=document.getElementById('search').value.toLowerCase().trim();
 let found=products.filter(p=>p[1].toLowerCase().includes(q));
 app.innerHTML=`<h2>🔎 Search Results</h2><div class="products">${found.length?found.map((p,i)=>`<div class="card"><div class="pic">${p[0]}</div><b>${p[1]}</b><div class="price">${p[2]}</div><button onclick="add(${products.indexOf(p)})">Add to Cart</button></div>`).join(''):'<div class="panel">No products found.</div>'}</div>`;
}
function show(page){({home,shop,seller,account,help}[page]||home)();window.scrollTo(0,0)}
home();
</script>
</body>
</html>
